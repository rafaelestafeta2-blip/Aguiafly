name: Build AguiaFly Android APK

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar & Gerar APK AguiaFly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK & Aceitar Licenças
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            echo "Usando sdkmanager em: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          else
            mkdir -p "$ANDROID_SDK_ROOT/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          fi

      - name: Restaurar debug.keystore a partir de debug.keystore.base64
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore restaurado com sucesso."
          fi

      - name: Preparar ficheiro .env com Chaves Reais (GitHub Secrets)
        env:
          DUFFEL_API_TOKEN: ${{ secrets.DUFFEL_API_TOKEN }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -n "$DUFFEL_API_TOKEN" ]; then
            echo "DUFFEL_API_TOKEN=${DUFFEL_API_TOKEN}" > .env
          else
            echo "DUFFEL_API_TOKEN=DUFFEL_SANDBOX_TOKEN_PLACEHOLDER" > .env
          fi
          if [ -n "$STRIPE_PUBLISHABLE_KEY" ]; then
            echo "STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}" >> .env
          else
            echo "STRIPE_PUBLISHABLE_KEY=STRIPE_PUBLISHABLE_KEY_PLACEHOLDER" >> .env
          fi
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}" >> .env
          else
            echo "STRIPE_SECRET_KEY=STRIPE_SECRET_KEY_PLACEHOLDER" >> .env
          fi

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK Oficial (assembleDebug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK para Download nos Artifacts do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: AguiaFly-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
